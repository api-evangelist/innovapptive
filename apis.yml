apis:
- aid: innovapptive:innovapptive-operator-rounds-api
  name: Innovapptive mRounds Operator Rounds External API
  description: >-
    The external Operator Rounds (mRounds) REST API on the Innovapptive Connected Business
    Operations host. It lets a tenant programmatically list published round plans, read
    a specific round plan with its tasks, create a round plan, and dynamically generate
    and partially execute a round against a plan. Access is granted with a tenant-scoped
    API key issued from the CBO Tenant Management module and passed in the x-api-key
    request header alongside a tenantid parameter; the key cannot be used by Innovapptive's
    own web or mobile clients, which use token-based authentication instead.
  humanURL: https://docs.innovapptive.com/2605/mRounds_configuration_guide/html/topics/api_using_overview.html
  baseURL: https://cbo.innovapptive.com/operatorroundsapi/external
  tags:
  - Operator Rounds
  - Inspections
  - Round Plans
  - Connected Worker
